function doDelete(id){if(!confirm('确定删除这条训练记录吗？'))return;const before=data.records;data.records=before.filter(r=>r.id!==id);if(!persist()){data.records=before;return}render();toast('记录已删除')}
function doRepeat(id){const rec=data.records.find(r=>r.id===id);if(!rec)return;const ex=selectedEx(rec.exerciseId)||{id:rec.exerciseId,name:rec.exerciseName,muscle:rec.muscle||'其他',equipment:rec.equipment||'其他'};state.selected=ex;state.weightMode=rec.mode;state.weight=rec.weight??state.weight;state.left=rec.left??state.left;state.right=rec.right??state.right;state.reps=rec.reps;state.mode='strength';render();window.scrollTo({top:0,behavior:'smooth'});toast('已填入上一组参数，点击记录一组')}
function renderHistory(){const grouped=new Map();[...data.records].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||'')).forEach(r=>{if(state.historyMonth!=='all'&&!r.date.startsWith(state.historyMonth))return;if(!grouped.has(r.date))grouped.set(r.date,[]);grouped.get(r.date).push(r)});const months=[...new Set(data.records.map(r=>r.date.slice(0,7)))].sort().reverse();return `${header('训练档案','WORKOUT HISTORY','所有重量、组数和有氧都记录在这里。')}<main><div class="between" style="margin-bottom:15px"><strong class="small">共 ${grouped.size} 个训练日</strong><select id="history-month" class="dropdown"><option value="all">全部月份</option>${months.map(m=>`<option value="${m}" ${state.historyMonth===m?'selected':''}>${m.replace('-',' 年 ')} 月</option>`).join('')}</select></div>${grouped.size===0?`<div class="card"><div class="empty"><div class="empty-icon">${icon('history')}</div>暂无符合条件的训练记录<br>训练后这里会自动生成日志</div></div>`:[...grouped.entries()].map(([date,recs])=>{const h=dateHeading(date),str=recs.filter(r=>r.type==='strength'),card=recs.filter(r=>r.type==='cardio'),groups=getGrouped(str),total=round(str.reduce((s,r)=>s+countVolume(r),0),0);return `<section class="card history-day"><div class="day-head"><div class="flex g12"><span class="date-tile"><strong>${h.date}</strong><span>${h.month}</span></span><div><strong style="font-size:15px">${date}</strong><div class="small muted" style="margin-top:5px">${h.week} · ${str.length} 组力量 · ${card.length} 项有氧</div></div></div><button class="btn btn-secondary btn-compact" data-viewdate="${date}">编辑 ${icon('chevron')}</button></div>${groups.map(g=>`<div class="history-line">${icon('dumbbell')}<span style="flex:1">${escapeHtml(g.name)} <span class="muted">× ${g.sets.length} 组</span><br><span class="muted">${g.sets.map(formatSet).join(' · ')}</span></span></div>`).join('')}${card.map(r=>`<div class="history-line">${icon('activity')}<span>${escapeHtml(r.activityName||'有氧训练')}<br><span class="muted">${formatCardio(r)}</span></span></div>`).join('')}<div class="divider"></div><div class="between small"><span class="muted">力量训练量</span><strong>${fmt(total,0)} kg</strong></div></section>`}).join('')}</main>`}
function rangeRecords(){const days=state.statsRange==='all'?Infinity:Number(state.statsRange);if(!Number.isFinite(days))return data.records;const cut=new Date(today()+'T00:00:00');cut.setDate(cut.getDate()-days+1);const boundary=`${cut.getFullYear()}-${String(cut.getMonth()+1).padStart(2,'0')}-${String(cut.getDate()).padStart(2,'0')}`;return data.records.filter(r=>r.date>=boundary&&r.date<=today())}
function chartHTML(recs){const days=state.statsRange==='7'?7:state.statsRange==='30'?6:state.statsRange==='90'?9:8;let bars=[];const todayD=new Date(today()+'T12:00:00');if(state.statsRange==='7'){for(let i=6;i>=0;i--){const d=new Date(todayD);d.setDate(d.getDate()-i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;bars.push({label:`${d.getMonth()+1}/${d.getDate()}`,value:recs.filter(r=>r.date===key&&r.type==='strength').reduce((s,r)=>s+countVolume(r),0)})}}else{const interval=state.statsRange==='30'?5:state.statsRange==='90'?10:30;const allDates=recs.map(r=>r.date).sort();const oldest=state.statsRange==='all'&&allDates.length?new Date(allDates[0]+'T12:00:00'):new Date(todayD.getTime()-interval*days*86400000);const totalDays=Math.max(1,Math.round((todayD-oldest)/86400000)+1);const sections=state.statsRange==='all'?Math.min(8,Math.max(1,Math.ceil(totalDays/30))):days;const width=Math.max(1,Math.ceil(totalDays/sections));for(let i=0;i<sections;i++){const start=new Date(oldest);start.setDate(start.getDate()+i*width);const end=new Date(start);end.setDate(end.getDate()+width);const st=`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;const en=`${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`;bars.push({label:`${start.getMonth()+1}/${start.getDate()}`,value:recs.filter(r=>r.date>=st&&r.date<en&&r.type==='strength').reduce((s,r)=>s+countVolume(r),0)})}}const max=Math.max(...bars.map(x=>x.value),1);return `<div class="bar-chart">${bars.map(b=>`<div class="bar-col" title="${b.label}：${fmt(b.value,0)} kg"><div class="bar" style="height:${b.value?Math.max(5,b.value/max*100):2}%"></div><span class="bar-label">${b.label}</span></div>`).join('')}</div><p class="chart-caption">显示区间内训练总量（kg），左右手重量均计入。自重训练不计入总量。</p>`}
function renderStats(){const recs=rangeRecords(),str=recs.filter(r=>r.type==='strength'),cardio=recs.filter(r=>r.type==='cardio');const totalVolume=str.reduce((s,r)=>s+countVolume(r),0);const days=new Set(recs.map(r=>r.date)).size;const minutes=cardio.reduce((s,r)=>s+n(r.duration),0);const kilometers=cardio.reduce((s,r)=>s+n(r.distance),0);const muscleTotals={};str.forEach(r=>muscleTotals[r.muscle||'其他']=(muscleTotals[r.muscle||'其他']||0)+countVolume(r));const muscles=Object.entries(muscleTotals).sort((a,b)=>b[1]-a[1]);const maxMuscle=Math.max(1,...muscles.map(x=>x[1]));const names=new Map();str.filter(r=>r.mode!=='bodyweight').forEach(r=>{const key=r.exerciseId||r.exerciseName;const load=r.mode==='split'?Math.max(n(r.left),n(r.right)):n(r.weight);const p=names.get(key);if(!p||load>p.weight)names.set(key,{name:r.exerciseName,weight:load,mode:r.mode})});const prs=[...names.values()].sort((a,b)=>b.weight-a.weight).slice(0,6);return `${header('进步，有迹可循。','YOUR PROGRESS','训练总量、肌群分布以及动作重量。')}<main><div class="between" style="margin-bottom:14px"><strong class="small">统计周期</strong><select class="dropdown" id="stats-range"><option value="7" ${state.statsRange==='7'?'selected':''}>近 7 天</option><option value="30" ${state.statsRange==='30'?'selected':''}>近 30 天</option><option value="90" ${state.statsRange==='90'?'selected':''}>近 90 天</option><option value="all" ${state.statsRange==='all'?'selected':''}>全部时间</option></select></div><section class="stat-grid"><div class="stat-big"><span class="label">训练天数</span><strong class="value">${days}<span class="unit-small">天</span></strong></div><div class="stat-big"><span class="label">力量训练组数</span><strong class="value">${str.length}<span class="unit-small">组</span></strong></div><div class="stat-big"><span class="label">力量总训练量</span><strong class="value">${fmt(totalVolume,0)}<span class="unit-small">kg</span></strong></div><div class="stat-big"><span class="label">有氧累计时长</span><strong class="value">${fmt(minutes,0)}<span class="unit-small">分钟</span></strong></div></section><section class="card"><div class="between"><h2 class="card-title">力量训练量趋势</h2><span class="pill">${state.statsRange==='all'?'累计':'近 '+state.statsRange+' 天'}</span></div>${chartHTML(recs)}</section><section class="card"><div class="between"><h2 class="card-title">肌群训练量</h2><span class="small muted">kg</span></div>${muscles.length?muscles.map(([name,value])=>`<div class="progress-row"><span class="progress-name">${escapeHtml(name)}</span><div class="progress-track"><div class="progress-fill" style="width:${value/maxMuscle*100}%"></div></div><span class="progress-value">${fmt(value,0)}</span></div>`).join(''):`<div class="empty">目前没有可统计的负重记录</div>`}</section><section class="card"><div class="between"><h2 class="card-title">动作最高记录</h2><span class="small muted">最大单次记录重量</span></div>${prs.length?prs.map(r=>`<div class="pr-item"><span>${escapeHtml(r.name)}${r.mode==='split'?` <span class="muted">(单侧)</span>`:''}</span><strong>${fmt(r.weight)} kg</strong></div>`).join(''):`<div class="empty">添加负重动作后，自动展示最高重量</div>`}<p class="inline-note">这里只展示记录中的最高重量，不等同于单次最大力量（1RM）。</p></section><section class="card"><h2 class="card-title">有氧概览</h2><div class="fields"><div class="mini-stat"><strong>${fmt(minutes,0)}</strong><span>累计分钟</span></div><div class="mini-stat"><strong>${fmt(kilometers,2)}</strong><span>估算公里</span></div></div><p class="inline-note">距离按输入的平均速度和训练时长估算，坡度不会改变水平距离计算。</p></section></main>`}
function renderSettings(){return `${header('我的训练数据','YOUR DATA','个人记录只保存在当前浏览器 / 主屏幕 App 内。')}<main><section class="card"><div class="between"><div><h2 class="card-title">数据备份与迁移</h2><p class="card-sub">共 ${data.records.length} 条记录、${data.customExercises.length} 个自定义动作</p></div>${icon('download')}</div><div class="settings-row"><div><div class="title">导出完整备份</div><div class="desc">JSON 文件，含全部训练记录和自定义动作</div></div><button class="btn btn-secondary btn-compact" id="export-json">导出</button></div><div class="settings-row"><div><div class="title">导出 CSV 表格</div><div class="desc">可用 Excel / Numbers 打开</div></div><button class="btn btn-secondary btn-compact" id="export-csv">导出</button></div><div class="settings-row"><div><div class="title">恢复 JSON 备份</div><div class="desc">合并导入，按记录 ID 去重，不覆盖现有记录</div></div><button class="btn btn-secondary btn-compact" id="import-json">导入</button></div></section><section class="card"><h2 class="card-title">安装到 iPhone 主屏幕</h2><div class="guide"><ol><li>先将本应用网站发布到 <strong>HTTPS 地址</strong>（例如 GitHub Pages）。</li><li>用 iPhone 的 <strong>Safari</strong> 打开该网址。</li><li>点击 Safari 的 <strong>分享</strong>，选择 <strong>添加到主屏幕</strong>。</li><li>以后像普通 App 一样从桌面打开，即可离线记录已缓存的页面。</li></ol><p>注意：Safari 网页和主屏幕 App 的存储空间可能相互独立。请在固定的打开方式中记录训练，并定期导出 JSON 备份。清除网站数据、卸载 App 或更换设备可能造成数据丢失。</p></div></section><section class="card"><div class="between"><div><h2 class="card-title">本机数据管理</h2><p class="card-sub">删除后无法恢复，除非此前导出备份</p></div><button class="danger-link" id="clear-data">清除所有记录</button></div></section><p class="inline-note" style="padding:5px 9px 22px">铁记 v1.0 · 无账号、无广告、无数据上传。体积轻巧，无需联网服务器即可保存到当前设备。</p></main>`}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function doExportJSON(){download(`铁记备份_${today()}.json`,JSON.stringify({app:'ironlog',version:1,exportedAt:new Date().toISOString(),records:data.records,customExercises:data.customExercises},null,2),'application/json;charset=utf-8');toast('已创建 JSON 备份')}
function doExportCSV(){const columns=['日期','类型','项目','肌群','器械','重量方式','总重量kg','左手kg','右手kg','次数','坡度%','速度km/h','时长分钟','距离km','创建时间'];const rows=data.records.map(r=>[r.date,r.type==='strength'?'力量':'有氧',r.exerciseName||r.activityName,r.muscle||'',r.equipment||'',r.mode||'',r.weight??'',r.left??'',r.right??'',r.reps??'',r.slope??'',r.speed??'',r.duration??'',r.distance??'',r.createdAt||'']);const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv='\ufeff'+[columns,...rows].map(row=>row.map(cell).join(',')).join('\r\n');download(`铁记训练记录_${today()}.csv`,csv,'text/csv;charset=utf-8');toast('已创建 CSV 表格')}
function validateRecord(r){if(!r||typeof r!=='object'||typeof r.id!=='string'||r.id.length>120||typeof r.date!=='string'||!/^(19|20)\d{2}-\d{2}-\d{2}$/.test(r.date))return false;return r.type==='strength'?typeof r.exerciseName==='string'&&r.exerciseName.length<=100&&['single','split','bodyweight'].includes(r.mode)&&Number.isFinite(n(r.reps)):r.type==='cardio'&&typeof r.activityName==='string'&&r.activityName.length<=100}
async function doImport(file){if(!file)return;if(file.size>10*1024*1024){toast('备份文件不能超过 10MB');return}try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.records)||obj.records.some(r=>!validateRecord(r)))throw Error('格式错误');if(obj.records.length>100000)throw Error('记录过多');const newCustom=Array.isArray(obj.customExercises)?obj.customExercises.filter(e=>e&&typeof e.id==='string'&&typeof e.name==='string'&&typeof e.muscle==='string'&&typeof e.equipment==='string'&&e.name.length<=40).slice(0,2000):[];const existing=new Set(data.records.map(r=>r.id)),exIds=new Set(data.customExercises.map(x=>x.id));const incoming=obj.records.filter(r=>!existing.has(r.id));const custom=newCustom.filter(e=>!exIds.has(e.id));if(!confirm(`即将导入 ${incoming.length} 条新记录和 ${custom.length} 个自定义动作（重复项自动跳过），确定吗？`))return;const old=data;data={records:[...data.records,...incoming],customExercises:[...data.customExercises,...custom]};if(!persist()){data=old;return}customCatalog=data.customExercises;render();toast(`成功导入 ${incoming.length} 条记录`)}catch(e){toast('导入失败：JSON 数据格式不正确')}finally{document.getElementById('backup-input').value=''}}
function clearAll(){if(!confirm('确定清除本机所有训练记录和自定义动作吗？此操作不可恢复。'))return;if(!confirm('请再次确认：是否永久删除所有数据？'))return;const old=data;data={records:[],customExercises:[]};if(!persist()){data=old;return}customCatalog=[];state.selected=catalog[0];render();toast('已清空本机记录')}
function handleClick(e){const button=e.target.closest('button');if(!button)return;const d=button.dataset;
if(d.tab){switchTab(d.tab);return}if(d.mode){if(state.mode==='strength')readStrengthInputs();else readCardioInputs();state.mode=d.mode;render();return}if(d.weightmode){readStrengthInputs();state.weightMode=d.weightmode;render();return}if(d.adjust){readStrengthInputs();const [target,delta]=d.adjust.split(':');if(target==='weight')state.weight=round(Math.max(0,n(state.weight)+Number(delta)));else{state.left=round(Math.max(0,n(state.left)+Number(delta)));state.right=round(Math.max(0,n(state.right)+Number(delta)))}render();return}if(d.delete){doDelete(d.delete);return}if(d.repeat){doRepeat(d.repeat);return}if(d.viewdate){state.date=d.viewdate;state.tab='train';render();window.scrollTo({top:0,behavior:'instant'});return}if(d.muscle){state.pickerMuscle=d.muscle;updatePicker();return}if(d.equip){state.pickerEquipment=d.equip;updatePicker();return}if(d.exercise){const ex=selectedEx(d.exercise);if(ex){state.selected=ex;fillLastRecord(ex);closePicker();render()}return}
switch(button.id){case 'open-picker':readStrengthInputs();openPicker();break;case 'close-picker':closePicker();break;case 'add-custom':addCustom();break;case 'add-set':doAddSet();break;case 'add-cardio':doAddCardio();break;case 'go-history':switchTab('history');break;case 'toggle-pace':readCardioInputs();if(!state.paceMode)state.pace=speedToPace(n(state.speed))==='--:--'?'12:00':speedToPace(n(state.speed));else{const s=paceToSpeed(state.pace);if(Number.isFinite(s))state.speed=round(s,2)}state.paceMode=!state.paceMode;render();break;case 'export-json':doExportJSON();break;case 'export-csv':doExportCSV();break;case 'import-json':document.getElementById('backup-input').click();break;case 'clear-data':clearAll();break;default:break}}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target.id==='picker-search'){state.pickerSearch=e.target.value;updatePicker()}else if(['duration','speed','slope','pace'].includes(e.target.id)){readCardioInputs();const p=document.getElementById('cardio-distance-preview');if(p)p.textContent=distancePreview()}});
document.addEventListener('change',e=>{switch(e.target.id){case 'session-date':if(e.target.value)state.date=e.target.value;render();break;case 'cardio-type':readCardioInputs();state.cardio=e.target.value;render();break;case 'stats-range':state.statsRange=e.target.value;render();break;case 'history-month':state.historyMonth=e.target.value;render();break}});
document.getElementById('backup-input').addEventListener('change',e=>doImport(e.target.files[0]));
document.addEventListener('click',e=>{if(e.target.id==='picker-backdrop')closePicker()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('picker-backdrop'))closePicker()});
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
